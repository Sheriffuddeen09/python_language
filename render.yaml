
services:
  - type: web
    name: python-translate
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python install_argos.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PYTHONUNBUFFERED
        value: "1"
